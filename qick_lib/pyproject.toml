[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qick"
dynamic = ["version"]
description = "Quantum Instrumentation Controller Kit software library (for mixmux8 high speed test)"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name = "Open Quantum Hardware", email = "openquantumhardware@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pynq>=2.6,<3.1; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
    "tqdm",
]

[project.optional-dependencies]
full = ["pyro4"]

[project.urls]
Homepage = "https://github.com/openquantumhardware/qick"
Source = "https://github.com/openquantumhardware/qick"

[tool.setuptools.dynamic]
version = { file = "qick/VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["qick*"]

[tool.setuptools.package-data]
qick = [
    "*.bit",
    "*.hwh",
    "VERSION",
    "ipq_pynq_utils/ipq_pynq_utils/data/*.json",
    "ipq_pynq_utils/ipq_pynq_utils/data/*.txt",
    "ipq_pynq_utils/ipq_pynq_utils/data/*.h",
    "ipq_pynq_utils/ipq_pynq_utils/data/clockFiles/*.txt",
]
